name: Public code checks

on:
  push:
  pull_request:

jobs:
  benchmark-interfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pydantic>=2.7,<3'
      - run: python -m unittest discover -s benchmarks/perception/tests -v
      - run: python -m unittest discover -s benchmarks/single_point/tests -v
      - run: python benchmarks/perception/inference/run.py --language en examples/synthetic/perception.jsonl --validate-input-only
      - run: python benchmarks/single_point/inference/run_text.py examples/synthetic/single_point.jsonl --language en --validate-input-only
      - run: python benchmarks/single_point/inference/run_multimodal.py examples/synthetic/single_point_multimodal.jsonl --validate-input-only
      - run: python benchmarks/perception/evaluation/evaluate.py --gold examples/synthetic/perception_gold.jsonl --predictions examples/synthetic/perception_predictions.jsonl --profile tee
      - run: python benchmarks/single_point/evaluation/evaluate.py --gold examples/synthetic/single_point_gold.jsonl --predictions examples/synthetic/single_point_predictions.jsonl --validate-input-only
      - run: python benchmarks/multi_step/evaluation/evaluate.py --gold examples/synthetic/multi_step.jsonl --predictions examples/synthetic/multi_step_predictions.jsonl --dry-run --no-progress

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e 'benchmarks/multi_step/agent[test]'
      - run: anestrace-l3 validate --input examples/synthetic/multi_step.jsonl
      - run: cd benchmarks/multi_step/agent && PYTHONPATH=src python -m pytest

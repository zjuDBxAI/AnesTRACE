[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "anestrace-level-three-agent"
version = "0.1.0"
description = "Tool-gated LangGraph inference runner for AnesBench Level Three"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiosqlite>=0.20,<1",
  "langchain-core>=1.5,<2",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[project.scripts]
anestrace-l3 = "anestrace_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anestrace_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
